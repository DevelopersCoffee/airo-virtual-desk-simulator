; Airo Core firmware for the ESP32-S3 (retrofit phase 2: bench prototype).
;
; Builds the same airo-core and board code as the laptop host (../airo-core,
; ../board) with ESP-IDF. BENCH MODE ONLY: no environment here defines
; AIRO_ALLOW_DESK_MODE, so this firmware cannot drive the desk.
;
;   pio run -d firmware/esp32                       # build
;   pio run -d firmware/esp32 -t upload             # flash over USB
;   pio device monitor -d firmware/esp32            # serial console (115200)
;
; See docs/BENCH_TEST.md before connecting anything.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
monitor_filters = direct
build_flags =
  ; Interface case the board boots in. The HIL suite switches it over the
  ; bench link; a real Interface Board is built for exactly one case.
  -DAIRO_INTERFACE_CASE_DEFAULT=\"A2\"
  ; Pin overrides, all [UNVERIFIED] placeholders (firmware/board/src/pin_map.cpp).
  ; Uncomment and change to match the breadboard. -1 = not connected.
  ; -DAIRO_PIN_HEARTBEAT=4
  ; -DAIRO_PIN_ARM=5
  ; -DAIRO_PIN_BYPASS_STATE=6
  ; -DAIRO_PIN_INJ_UP=7
  ; -DAIRO_PIN_INJ_DOWN=15
  ; -DAIRO_PIN_INJ_SIT=16
  ; -DAIRO_PIN_INJ_STAND=17
  ; -DAIRO_PIN_SENSE_UP=8
  ; -DAIRO_PIN_SENSE_DOWN=9
  ; -DAIRO_PIN_SENSE_SIT=10
  ; -DAIRO_PIN_SENSE_STAND=11
  ; -DAIRO_PIN_SENSE_RESET=12
  ; -DAIRO_PIN_UART_HTX_TX=18
  ; -DAIRO_PIN_UART_HTX_RX=13
  ; -DAIRO_PIN_UART_DTX_RX=14
  ; -DAIRO_OUTPUTS_ACTIVE_LOW=0
  ; -DAIRO_INPUTS_ACTIVE_LOW=1
