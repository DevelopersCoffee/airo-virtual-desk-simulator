name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Firmware core unit tests (C++, host build)
        run: npm run firmware:test
      - name: End-to-end simulation matrix (spec 12.1)
        run: npm run test:e2e
      - run: npm run build
